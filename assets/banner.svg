<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f81f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic / Animated Background Graphics (Pills, Flow Lines, Nodes, Cards) -->
  <g opacity="0.25">
    <!-- Grid Overlay -->
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Animated Data Pipeline Path 1 -->
    <path d="M 50 320 Q 300 380 600 320 T 1150 350" fill="none" stroke="url(#blueCyan)" stroke-width="3" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="8s" repeatCount="indefinite"/>
    </path>
    
    <!-- Animated Data Pipeline Path 2 -->
    <path d="M 50 80 Q 400 20 800 70 T 1150 50" fill="none" stroke="url(#purplePink)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite"/>
    </path>

    <!-- Floating Background Nodes/Pills (Lower Z-Index / Opacity) -->
    <rect x="80" y="50" width="110" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="y" values="50;42;50" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Pipeline</text>

    <rect x="980" y="310" width="130" height="30" rx="15" fill="#1e293b" stroke="#a855f7" stroke-width="1.5">
      <animate attributeName="y" values="310;318;310" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="1045" y="330" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Model Registry</text>

    <rect x="1000" y="70" width="120" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="y" values="70;78;70" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="1060" y="90" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">CI/CD Triggers</text>

    <!-- Animated Pulsing Spheres -->
    <circle cx="200" cy="340" r="6" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="65" r="7" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Container (High Contrast, Clear Visibility) -->
  <g text-anchor="middle">
    <!-- Top Badge / Pill -->
    <rect x="420" y="45" width="360" height="34" rx="17" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="600" y="67" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
      ⚡ MLOPS &amp; ML CI/CD ORCHESTRATION ⚡
    </text>

    <!-- Main Title -->
    <text x="600" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Machine Learning CI/CD
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="195" fill="#f3f4f6" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">
      &amp; MLOps Orchestration Platforms
    </text>

    <!-- Description / Subtitle Line 2 -->
    <text x="600" y="240" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Curated Stack of Top Commercial SaaS Platforms &amp; High-Star Open-Source Projects
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(240, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="75" y="21" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🔄 ML Pipelines</text>

      <!-- Tag 2 -->
      <rect x="170" y="0" width="180" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="260" y="21" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📊 Experiment Tracking</text>

      <!-- Tag 3 -->
      <rect x="370" y="0" width="180" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="460" y="21" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📦 Model Registry</text>

      <!-- Tag 4 -->
      <rect x="570" y="0" width="150" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="645" y="21" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="600">☸️ Kubernetes</text>
    </g>
  </g>
</svg>
